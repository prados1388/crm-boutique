<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Vista previa del CRM Boutique">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f3ebe3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#c45c2a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="96" y="96" fill="#c45c2a" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">CRM BOUTIQUE</text>
  <text x="96" y="190" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">Gestión de ventas, seguimiento</text>
  <text x="96" y="248" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">clientes y registro de datos</text>
  <text x="96" y="310" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif" font-size="22">Accede al panel interno para potenciar tus ventas, hacer lista de favoritos,</text>
  <text x="96" y="342" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif" font-size="22">acceder a los datos de tus clientes y crear tus planes de acción.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="96" y="390" width="92" height="36" rx="18" fill="#fff" stroke="#c45c2a" stroke-width="1.5"/>
    <text x="142" y="413" fill="#c45c2a" text-anchor="middle">Clientes</text>
    <rect x="204" y="390" width="92" height="36" rx="18" fill="#fff" stroke="#c45c2a" stroke-width="1.5"/>
    <text x="250" y="413" fill="#c45c2a" text-anchor="middle">Compras</text>
    <rect x="312" y="390" width="92" height="36" rx="18" fill="#fff" stroke="#c45c2a" stroke-width="1.5"/>
    <text x="358" y="413" fill="#c45c2a" text-anchor="middle">Alarmas</text>
    <rect x="420" y="390" width="92" height="36" rx="18" fill="#fff" stroke="#c45c2a" stroke-width="1.5"/>
    <text x="466" y="413" fill="#c45c2a" text-anchor="middle">VIP anual</text>
  </g>
  <rect x="760" y="120" width="420" height="480" rx="24" fill="#fff" filter="url(#shadow)"/>
  <text x="804" y="176" fill="#c45c2a" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ACCESO PRIVADO</text>
  <text x="804" y="228" fill="#1f2937" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Iniciar sesión</text>
  <text x="804" y="262" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif" font-size="16">Introduce tus credenciales de staff para continuar.</text>
  <text x="804" y="318" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Email</text>
  <rect x="804" y="328" width="332" height="48" rx="12" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="820" y="358" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="16">profe@crm.com</text>
  <text x="804" y="418" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Contraseña</text>
  <rect x="804" y="428" width="332" height="48" rx="12" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="820" y="458" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="16">Tu contraseña</text>
  <rect x="804" y="510" width="332" height="52" rx="26" fill="#c45c2a"/>
  <text x="970" y="542" fill="#fff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Entrar al CRM</text>
</svg>
